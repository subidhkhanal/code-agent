name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          # pyright's bundled Node.js needs libatomic (found by a local Linux CI preview)
          sudo apt-get update -qq && sudo apt-get install -y -qq libatomic1
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests benchmarks evals
          ruff format --check src tests benchmarks evals

      - name: Type check
        run: pyright

      # Scripted fake LLM and a hashing embedder: no API key, no model download, no cost.
      - name: Tests (unit, integration, security suite)
        run: pytest -o addopts="" -q
