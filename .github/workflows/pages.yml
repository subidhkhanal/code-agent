name: Pages

on:
  push:
    branches: [main]
    paths: ["src/code_agent/playground/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          # The playground's backend (render.yaml). The page is the playground UI, pointed at it.
          PLAYGROUND_API: https://code-agent-playground.onrender.com/
        run: |
          mkdir -p _site
          sed 's|<meta name="playground-api" content="">|<meta name="playground-api" content="'"$PLAYGROUND_API"'">|' \
            src/code_agent/playground/static/index.html > _site/index.html
          grep -q "content=\"$PLAYGROUND_API\"" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
