name: Playground

# Redeploys the hosted playground (docs/playground.md) after CI passes on main.
# Needs the repo secret HF_TOKEN (write token) and the repo variable HF_SPACE (owner/space);
# without HF_SPACE the job is skipped.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble the Space
        run: sh deploy/huggingface/assemble.sh "$RUNNER_TEMP/space"

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          pip install -q "huggingface_hub>=0.25"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
              commit_message=f"Deploy {os.environ['SHA'][:7]}",
              delete_patterns=["src/**", "deploy/**"],  # drop files removed from the repo
          )
          EOF
