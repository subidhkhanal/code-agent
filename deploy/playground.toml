# Agent config for the hosted playground (see docs/playground.md, ADR 0011).
# The API key is NOT here: it comes from the ANTHROPIC_API_KEY secret of the hosting platform.
# Spending limits per day / visitor / run are PLAYGROUND_* environment variables (app.py).

[llm]
max_attempts = 3
max_prompt_tokens = 40000
max_output_tokens = 16000    # thinking counts toward this, so leave room

[llm.providers.anthropic]
kind = "anthropic"
effort = "medium"            # set explicitly; lower it before prompting for brevity
timeout_s = 180

# One model for both roles. Checked against the live model list at startup; runs are
# disabled with a clear message if it is not offered.
[llm.routes]
cheap = ["anthropic:claude-opus-5-5"]
strong = ["anthropic:claude-opus-5-5"]

# USD per million tokens. Cache writes use the 5-minute rate.
[llm.pricing."anthropic:claude-opus-5-5"]
input_per_mtok = 4.0
output_per_mtok = 20.0
cache_read_per_mtok = 0.20
cache_write_per_mtok = 5.0

[retrieval]
max_context_tokens = 8000    # the sample repos are tiny

[budgets]
max_edit_attempts = 3
max_fix_attempts = 2
